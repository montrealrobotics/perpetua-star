[project]
name = "perpetua2"
version = "0.1.0"
description = "Perpetua*: persistence estimation of semi-static objects with adaptive switching priors."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "dill>=0.4.0",
    "flax>=0.10.7,<0.13",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "jax>=0.6.2,<0.9",
    "matplotlib==3.9.2",
    "natsort>=8.4.0",
    "numpy==2.1.2",
    "prettytable==3.11.0",
    "pyyaml==6.0.2",
    "ruptures>=1.1.10",
    "scienceplots>=2.2.0",
    "scipy==1.14.1",
    "seaborn>=0.13.2",
    "tqdm==4.66.5",
]

[project.urls]
Homepage = "https://montrealrobotics.ca/predictive-graphs/"
Repository = "https://github.com/montrealrobotics/perpetua-star"

[project.optional-dependencies]
# NVIDIA GPU support on Linux. Everything also runs on CPU.
cuda = ["jax[cuda12]>=0.6.2,<0.9 ; sys_platform == 'linux'"]
# Query Gemini for LLM switching-prior schedules that are not cached in models/.
llm = ["google-genai>=1.49.0"]
# SemiStaticSim (ProcTHOR) data loaders in perpetua2.data.procthor.
procthor = ["semistaticsim>=0.5.12"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"
