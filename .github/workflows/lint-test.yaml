name: Test

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
      - name: Config Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies from the lockfile
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked
      - name: Run tests with pytest
        run: uv run --locked pytest -v
